<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Outfit 420-2 social preview</title>
  <desc id="desc">A social preview card for Outfit 420-2 using the three corporation images with large title text.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.12" />
      <stop offset="0.45" stop-color="#000" stop-opacity="0.5" />
      <stop offset="1" stop-color="#000" stop-opacity="0.15" />
    </linearGradient>
    <filter id="textShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#000" flood-opacity="1" />
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="1" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0b0e13" />
  <image href="outfit-logo-bg-bull.png" x="0" y="-5" width="400" height="640" preserveAspectRatio="xMidYMid slice" />
  <image href="outfit-logo-bg-wings.png" x="400" y="-5" width="400" height="640" preserveAspectRatio="xMidYMid slice" />
  <image href="outfit-logo-bg-wayne.png" x="800" y="-5" width="400" height="640" preserveAspectRatio="xMidYMid slice" />
  <rect width="1200" height="630" fill="url(#shade)" />

  <text
    x="600"
    y="350"
    text-anchor="middle"
    filter="url(#textShadow)"
    fill="#f4f7fb"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="142"
    font-weight="900"
  >Outfit 420-2</text>
</svg>
