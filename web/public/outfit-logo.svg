<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-labelledby="title desc">
  <title id="title">Outfit 420-2</title>
  <desc id="desc">A three-panel logo using the corporation images as a background with Outfit 420-2 text overlaid.</desc>
  <defs>
    <clipPath id="logoClip">
      <rect width="760" height="230" rx="20" />
    </clipPath>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.2" />
      <stop offset="0.45" stop-color="#000" stop-opacity="0.38" />
      <stop offset="1" stop-color="#000" stop-opacity="0.2" />
    </linearGradient>
    <filter id="textShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#000" flood-opacity="1" />
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="1" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="1" />
    </filter>
  </defs>

  <g clip-path="url(#logoClip)">
    <rect width="760" height="230" fill="#0b0e13" />
    <image href="outfit-logo-bg-bull.png" x="0" y="-12" width="254" height="254" preserveAspectRatio="xMidYMid slice" />
    <image href="outfit-logo-bg-wings.png" x="253" y="-12" width="254" height="254" preserveAspectRatio="xMidYMid slice" />
    <image href="outfit-logo-bg-wayne.png" x="506" y="-12" width="254" height="254" preserveAspectRatio="xMidYMid slice" />
    <rect width="760" height="230" fill="url(#shade)" />
    <rect width="760" height="230" fill="none" stroke="#2b3340" stroke-width="3" />
  </g>

  <text
    x="380"
    y="146"
    transform="scale(1.05 1.06)"
    text-anchor="middle"
    filter="url(#textShadow)"
    fill="#f4f7fb"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="92"
    font-weight="900"
  >Outfit 420-2</text>
</svg>
